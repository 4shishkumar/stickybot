# fab/project/config.yaml — project overrides.
# Presence = override: any live field here wins over ~/.fab-kit/config.yaml and
# built-in defaults, even if its value equals the default. Generated by
# `fab config init`; reconciled on every upgrade by `fab config upgrade`.

project:
    name: stickybot
    description: "StickyBot: an M5StickS3 (ESP32-S3) on your desk that works as a Bluetooth macro keyboard and mouse, takes voice requests for Claude Code, shows approvals, faces and games, and the Mac app that drives it"

# Where the implementation lives (a monorepo: firmware, the Rust Mac app, the legacy
# Python app whose dashboard the Rust app serves, tooling, the older XIAO prototype).
source_paths:
    - m5-stick-s3/src/
    - desktop/crates/
    - mac-agent/stick_agent/
    - tools/
    - m5-stick-s3/tools/
    - xiao-esp32-c3/src/

# Test files, for /git-pr's tests-vs-implementation line counts. Rust unit tests that
# sit inline in a source file (#[cfg(test)] mod tests) can't be matched by a path and
# count as implementation; the separate *_tests.rs files and tests/ folders do count.
test_paths:
    - "m5-stick-s3/test/**"            # firmware: native Unity suites (pio test -e native)
    - "mac-agent/tests/**"             # Python app: pytest, fixtures, the fake Claude
    - "desktop/crates/*/tests/**"      # Rust app: integration tests (talk_e2e, wmic_e2e)
    - "desktop/**/*_tests.rs"          # Rust app: unit tests kept in their own file
    - "**/*.test.mjs"                  # dashboard JS (node --test)

# Left out of the PR body's "true impact" line counts: fab's own files, docs, and
# generated or machine-written files that would drown the real change.
true_impact_exclude:
    - fab/
    - docs/
    - m5-stick-s3/src/sounds_clips.cpp  # generated by tools/make_sounds.py
    - m5-stick-s3/src/fonts_vlw.cpp     # generated by tools/make_fonts.py
    - faces/*/previews/*                # rendered face previews (any depth: * also matches /)
    - desktop/Cargo.lock

# Extra sections under every plan's Acceptance, for the two rules a diff can't show:
# old firmware / old apps still work, and device-facing changes were tried on a real stick.
checklist:
    extra_categories: [compatibility, real_stick_check]

# >>> fab reference (kit 2.28.16) >>> --------------------------------------
# Overridable fields you have NOT overridden, with current defaults.
# REGENERATED by `fab config upgrade` on every upgrade — edits inside this
# fence are overwritten. To override a field: move it ABOVE the fence and
# uncomment it.
#
# consolidate.detectors — duplicate-detection commands /code-dedupe runs to
# seed its sweep; {paths} and {out} substitute at run time (shell-quoted). [project]
# Full prose: fab config explain consolidate.detectors
# consolidate:
#   detectors:
#     - jscpd --reporters json --output {out} {paths}
#
# dispatch.mode / dispatch.column_width / dispatch.min_cols / dispatch.min_rows /
# dispatch.reap_done — stage-dispatch mode (pane → native → headless,
# descending), the pane-worker column width in percent, the split geometry
# floor (below it the worker opens in a manually-sized window), and done-pane
# reaping. [both]
# Settable machine-wide: fab config set --system dispatch.mode <pane|native|headless>
#                        fab config set --system dispatch.column_width <percent>
#                        fab config set --system dispatch.min_cols <cols>
#                        fab config set --system dispatch.min_rows <rows>
#                        fab config set --system dispatch.reap_done <true|false>
# Full prose: fab config explain dispatch.mode
# dispatch:
#   mode: native
#   column_width: 45
#   min_cols: 50
#   min_rows: 20
#   reap_done: true
#
# agent.session / agent.workers — providers for the two agent DEPTHS: session is
# what you talk to (fab agent/operator/batch), workers is what stages dispatch
# to. agent.profiles.<role> is the sparse per-role escape hatch beneath the
# knobs. Default claude. [both]
# Settable machine-wide: fab config set --system agent.session <provider>
#                        fab config set --system agent.workers <provider>
# Full prose: fab config explain agent.session
# agent:
#   session: claude
#   workers: claude
#   # profiles:
#   #   operator: { provider: codex }    # example: coordinate from another CLI
#   #   review: { provider: codex }      # example: run just the critic elsewhere
#
# autopilot.merge_mode — standing merge-topology preference for `fab operator
# autopilot start` (cherry-pick-ladder, merge-auto, stacked-prs); an explicit --mode
# flag outranks it. [both]
# Settable machine-wide: fab config set --system autopilot.merge_mode <cherry-pick-ladder|merge-auto|stacked-prs>
# Full prose: fab config explain autopilot.merge_mode
# autopilot:
#   merge_mode: cherry-pick-ladder
#
# docs_index.roots — documentation roots for fab docs-index. [project]
# Full prose: fab config explain docs_index.roots
# docs_index:
#   roots:
#     - path: docs/memory
#       index_file: index.md
#       log: true
#       max_depth: 3
#     # - path: docs/specs
#     #   also_accept: [README.md]
#     #   superseded: ["**/archive/**"]
#     #   exclude: ["assets/**"]  # files/folders never indexed: no row, no count, no landing
#     #   nav_note: "> **New here?** …"  # optional root-landing note, rendered verbatim; omitted when unset

#
# stage_hooks — optional per-stage pre/post shell commands honored by
# `fab status start` / `fab status finish`; a failing pre hook blocks start.
# Add by hand. Valid stage keys: apply, hydrate, intake, review, review-pr, ship. [project]
# Full prose: fab config explain stage_hooks
# stage_hooks:
#   apply:
#     pre: ./scripts/check-clean-tree.sh
#     post: make test
# <<< end fab reference <<< ------------------------------------------------
