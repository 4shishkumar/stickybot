; BLE macro keyboard — M5StickS3
;
; No dedicated PlatformIO board exists for the StickS3 yet; M5Stack's docs use
; esp32-s3-devkitc-1 with 8 MB flash + 8 MB octal PSRAM, as below. We use the
; pioarduino platform (Arduino core 3.x) instead of M5Stack's espressif32@6.x
; (core 2.x) because HijelHID_BLEKeyboard / NimBLE 2.x need core 3.x.

[platformio]
; Local, untracked overrides (e.g. the OTA password) — see secrets.example.ini
extra_configs = secrets.ini
; `pio run` builds the stick firmware; tests: `pio test -e native` (see Makefile)
default_envs = sticks3

[env:sticks3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
extra_scripts = pre:tools/embed_page.py
; The board file forces ARDUINO_USB_MODE=1 (USB-Serial-JTAG); replace its flags
; so TinyUSB can add the microphone.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
; TinyUSB serial: reset into the bootloader with a 1200-baud "touch"
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.before_reset = usb_reset
lib_deps =
    ; M5GFX, M5Unified and M5PM1 pinned to the tested versions (upstream changes broke the release build)
    m5stack/M5GFX@0.2.33
    M5Unified=https://github.com/m5stack/M5Unified#e125e73f28b6b83e621e48df432af426bb2ff935
    M5PM1=https://github.com/m5stack/M5PM1#be9a5456c007c333e7ac963f33bfde1ffa5d82ee
    h2zero/NimBLE-Arduino@^2.3.8
    ; HijelHID_BLEKeyboard 0.5.0 is vendored in lib/ (Apple fn key + PnP ID changes)
    bblanchon/ArduinoJson@^7
build_flags =
    -D BOARD_HAS_PSRAM
    ; Native USB through TinyUSB: serial port + USB microphone (usbmic.cpp)
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; NimBLE: 48 Bluetooth buffers instead of 12 (12 KB). With 12, a long reply to the Mac
    ; (@state with the faces) filled them all and key presses (the typed Mac password)
    ; and wireless-mic audio were dropped; the Mac's writes failed "Insufficient Resource"
    -D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=48
    '-D USB_PRODUCT="StickyBot"'
    '-D USB_MANUFACTURER="StickyBot"'
    ; the core USB library includes FS.h but doesn't declare it
    -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

; Over-the-air upload while Web settings is on:
;   pio run -e sticks3_ota -t upload
; --auth must match the device password (default "macro-setup").
[env:sticks3_ota]
extends = env:sticks3
upload_protocol = espota
upload_port = stickybot.local
upload_flags = --auth=macro-setup

; Unit tests on the Mac for the pure logic in src/logic/ (no Arduino, no stick):
;   pio test -e native        (or: make test)
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<logic/>
lib_ignore = HijelHID_BLEKeyboard, StickUSBAudio
; logic/ir_doc.cpp reads the IR remote files with it (header-only, works without Arduino)
lib_deps = bblanchon/ArduinoJson@^7
build_flags = -std=gnu++17 -Wall -Wextra -Wno-unused-parameter
