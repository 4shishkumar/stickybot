# CI for when the repo has a remote. macOS runners: the agent needs macOS frameworks
# (Core Bluetooth via bleak, MLX), and building the firmware is the same as on a dev Mac.
name: CI
on:
  push:
  pull_request:

jobs:
  agent:
    runs-on: macos-15          # Apple Silicon (MLX wheels)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: mac-agent/pyproject.toml
      - name: Install
        run: python -m pip install -e "mac-agent[dev]"
      - name: Lint
        working-directory: mac-agent
        run: python -m ruff check .
      - name: Tests (fast; the slow ones need the 2.5 GB speech model)
        working-directory: mac-agent
        run: python -m pytest

  firmware:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # not 3.15: the pioarduino platform rejects it
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            m5-stick-s3/.pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('m5-stick-s3/platformio.ini', 'xiao-esp32-c3/platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Local secrets placeholder (OTA password, not used in CI)
        run: |
          cp m5-stick-s3/secrets.example.ini m5-stick-s3/secrets.ini
          cp xiao-esp32-c3/secrets.example.ini xiao-esp32-c3/secrets.ini
      - name: M5StickS3 unit tests (native)
        working-directory: m5-stick-s3
        run: pio test -e native
      - name: Build M5StickS3
        working-directory: m5-stick-s3
        run: pio run -e sticks3
      - name: Build XIAO ESP32-C3
        working-directory: xiao-esp32-c3
        run: pio run -e xiao_c3
