# Publishes a GitHub release when a version tag is pushed (made by tools/release.sh):
#   v1.8.0          a stable release
#   v1.8.0-beta.1   a prerelease (the agent's "beta" update channel)
# Runs the agent and firmware tests, builds the M5StickS3 firmware, and attaches its
# four flash parts + manifest.json (versions, offsets, sizes, sha256, flash params) to
# the release, with the notes from CHANGELOG.md. The agent downloads these assets
# (stick_agent/releases.py) and checks every part's sha256 against the manifest.
#
# One Linux job (cheap minutes): the agent's tests don't need its macOS-only libraries
# (rumps, MLX, PortAudio), so they're left out here; CI on pull requests (ci.yml) runs
# the full set on macOS. Only the built-in GITHUB_TOKEN is used.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload its assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # not 3.15: the pioarduino platform rejects it
          cache: pip
          cache-dependency-path: mac-agent/pyproject.toml

      - name: Check the tag against the version and the changelog
        id: version
        run: |
          version="$(python tools/release_tool.py check-tag "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          python tools/release_tool.py notes "$version" > "$RUNNER_TEMP/notes.md"
          echo "firmware $(python tools/release_tool.py firmware), agent $version"

      - name: Agent — install (without the macOS-only libraries)
        run: |
          python -m pip install --no-deps -e mac-agent
          python -m pip install bleak aiohttp numpy soundfile soxr pyserial huggingface_hub cryptography \
            "pytest>=8" "pytest-asyncio>=0.23" "pytest-aiohttp>=1.0" "ruff>=0.5"

      - name: Agent — lint and tests
        working-directory: mac-agent
        run: |
          python -m ruff check .
          python -m pytest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            m5-stick-s3/.pio/libdeps
          key: pio-release-${{ runner.os }}-${{ hashFiles('m5-stick-s3/platformio.ini') }}

      - name: Firmware — install PlatformIO
        run: |
          python -m pip install platformio
          cp m5-stick-s3/secrets.example.ini m5-stick-s3/secrets.ini   # OTA password placeholder (unused)

      - name: Firmware — native unit tests
        working-directory: m5-stick-s3
        run: pio test -e native

      - name: Firmware — build
        working-directory: m5-stick-s3
        run: pio run -e sticks3

      - name: Firmware — release bundle (parts + manifest.json)
        run: |
          python m5-stick-s3/tools/make_release.py --out dist \
            --release "$GITHUB_REF_NAME" --agent-version "${{ steps.version.outputs.version }}"
          cat dist/manifest.json
          (cd dist && sha256sum ./*)

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -- --title "StickyBot $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          if [ "$PRERELEASE" = true ]; then set -- "$@" --prerelease; fi
          gh release create "$GITHUB_REF_NAME" "$@" \
            dist/manifest.json dist/bootloader.bin dist/partitions.bin dist/boot_app0.bin dist/app.bin
