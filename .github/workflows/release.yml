# Publishes a GitHub release when a version tag is pushed (made by tools/release.sh):
#   v1.8.0          a stable release
#   v1.8.0-beta.1   a prerelease (the agent's "beta" update channel)
#
# Three jobs:
#   tests    (ubuntu)    the tag check, the agent's lint + tests, the firmware's native tests and
#                        build, the firmware bundle: four flash parts + manifest.json (versions,
#                        offsets, sizes, sha256, flash params)
#   mac-app  (macos-15,  the Rust Mac app (desktop/): cargo test + clippy, StickyBot.app built and
#             arm64)     signed ad hoc (no Apple identity: unsigned for Gatekeeper, see README.md
#                        "Install the Mac app"), zipped as StickyBot-<version>-macos-arm64.zip;
#                        with the update key (below) also the signed update for the in-app
#                        updater, StickyBot-<version>-macos-arm64.app.tar.gz and its .sig
#   publish  (ubuntu)    adds the zip to manifest.json ("apps"), writes latest.json (the file the
#                        app's updater reads) when there is a signed update, creates the release
#                        with the firmware parts, the zip, the update files and the notes from
#                        CHANGELOG.md
# The agent downloads the firmware assets (stick_agent/releases.py) and checks every part's sha256
# against the manifest; it ignores "apps", so older agents read the new manifest as before.
#
# The update key: the repository secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (docs/RELEASING.md, "Update signing key"). The Mac app carries
# the matching public key and installs only updates signed with the private one. Without the
# secrets (a run by hand from a fork, say) the build still passes and just leaves the update files
# out; a tag without them still publishes the release, with a warning that it can't be installed
# from inside the app.
#
# Run it by hand (Actions → Release → Run workflow, on any branch) to try the Mac app build before
# tagging: only mac-app runs, nothing is published, and the zip (and the update files, when the
# secrets are there) are a workflow artifact.
#
# The agent's tests here leave out its macOS-only libraries (rumps, MLX, PortAudio), which they
# don't need, as CI on pull requests does (ci.yml). Only GITHUB_TOKEN is used.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # sherpa-onnx's prebuilt static libraries (speech to text, linked into the app). Its build script
  # downloads them unchecked; we fetch the same archive ourselves, check it, and hand it over
  # (SHERPA_ONNX_ARCHIVE_DIR). Moving sherpa-onnx (desktop/crates/stt/Cargo.toml): update all three.
  SHERPA_ONNX_VERSION: "2.0.1"
  SHERPA_ONNX_ARCHIVE: sherpa-onnx-v2.0.1-osx-arm64-static-lib.tar.bz2
  SHERPA_ONNX_SHA256: d7a9b14f337958e7373c8c650f046df33d210bbaff2f33cb8322dda663ee5e1c
  # the Tauri CLI that bundles the app (made for tauri 2.12.5, desktop/Cargo.lock)
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # not 3.15: the pioarduino platform rejects it
          cache: pip
          cache-dependency-path: mac-agent/pyproject.toml

      - name: Check the tag against the version and the changelog
        id: version
        run: |
          version="$(python tools/release_tool.py check-tag "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "firmware $(python tools/release_tool.py firmware), agent $version"

      - name: Agent — install (without the macOS-only libraries)
        run: |
          python -m pip install --no-deps -e mac-agent
          python -m pip install bleak aiohttp numpy soundfile soxr pyserial huggingface_hub cryptography \
            "pytest>=8" "pytest-asyncio>=0.23" "pytest-aiohttp>=1.0" "ruff>=0.5"

      - name: Agent — lint and tests
        working-directory: mac-agent
        run: |
          python -m ruff check .
          python -m pytest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            m5-stick-s3/.pio/libdeps
          key: pio-release-${{ runner.os }}-${{ hashFiles('m5-stick-s3/platformio.ini') }}

      - name: Firmware — install PlatformIO
        run: |
          python -m pip install platformio
          cp m5-stick-s3/secrets.example.ini m5-stick-s3/secrets.ini   # OTA password placeholder (unused)

      - name: Firmware — native unit tests
        working-directory: m5-stick-s3
        run: pio test -e native

      - name: Firmware — build
        working-directory: m5-stick-s3
        run: pio run -e sticks3

      - name: Firmware — release bundle (parts + manifest.json)
        run: |
          python m5-stick-s3/tools/make_release.py --out dist \
            --release "$GITHUB_REF_NAME" --agent-version "${{ steps.version.outputs.version }}"
          cat dist/manifest.json
          (cd dist && sha256sum ./*)

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error
          retention-days: 7

  mac-app:
    needs: tests
    # after the tests on a tag; on its own when run by hand (the tests job is skipped then)
    if: >-
      !cancelled() && (needs.tests.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.tests.result == 'skipped'))
    runs-on: macos-15   # Apple silicon (arm64)
    timeout-minutes: 60
    outputs:
      zip: ${{ steps.names.outputs.zip }}
      tarball: ${{ steps.names.outputs.tarball }}
      updater: ${{ steps.updater.outputs.present }}   # "true" when the signed update was made and checked
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Version and file name
        id: names
        env:
          TAG_VERSION: ${{ needs.tests.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="$TAG_VERSION"; label="$TAG_VERSION"
          else   # a test build: the repo's version, the commit in the file name
            version="$(python3 ../tools/release_tool.py current)"; label="$version-dev.${GITHUB_SHA::7}"
          fi
          {
            echo "version=$version"
            echo "zip=StickyBot-$label-macos-arm64.zip"
            echo "tarball=StickyBot-$label-macos-arm64.app.tar.gz"
          } >> "$GITHUB_OUTPUT"
          echo "StickyBot $version -> StickyBot-$label-macos-arm64.zip"

      - name: Rust (stable, with clippy)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          cache-bin: "false"   # the Tauri CLI has its own cache (below)
          cache-on-failure: true

      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Cache the sherpa-onnx libraries
        uses: actions/cache@v4
        with:
          path: ~/sherpa-onnx-archive
          key: sherpa-onnx-${{ env.SHERPA_ONNX_SHA256 }}

      - name: Fetch and check the sherpa-onnx libraries
        run: |
          dir="$HOME/sherpa-onnx-archive"
          mkdir -p "$dir"
          if [ ! -f "$dir/$SHERPA_ONNX_ARCHIVE" ]; then
            curl -fsSL --retry 3 -o "$dir/$SHERPA_ONNX_ARCHIVE" \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$SHERPA_ONNX_VERSION/$SHERPA_ONNX_ARCHIVE"
          fi
          echo "$SHERPA_ONNX_SHA256  $dir/$SHERPA_ONNX_ARCHIVE" | shasum -a 256 -c -
          echo "SHERPA_ONNX_ARCHIVE_DIR=$dir" >> "$GITHUB_ENV"

      - name: Tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build StickyBot.app (ad-hoc signature, and the signed update when the key is set)
        env:
          STICKYBOT_VERSION: ${{ steps.names.outputs.version }}
          # empty when the secrets aren't set: build-app.sh then skips the update files
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          unset APPLE_SIGNING_IDENTITY STICKYBOT_SIGNING_IDENTITY
          scripts/build-app.sh
          app=target/release/bundle/macos/StickyBot.app
          codesign -dv "$app" 2>&1 | grep -q '^Signature=adhoc' || { echo "not signed ad hoc"; exit 1; }
          # the speech model is downloaded by the app on first start, never bundled
          find "$app" -type f -exec ls -l {} +
          du -sh "$app"

      - name: Zip
        env:
          ZIP: ${{ steps.names.outputs.zip }}
        run: |
          mkdir -p ../dist-app
          ditto -c -k --keepParent target/release/bundle/macos/StickyBot.app "../dist-app/$ZIP"
          ls -l ../dist-app && shasum -a 256 "../dist-app/$ZIP"

      - name: Check the signed update and name it for the release
        id: updater
        env:
          TARBALL: ${{ steps.names.outputs.tarball }}
        run: |
          bundle=target/release/bundle/macos
          if [ ! -s "$bundle/StickyBot.app.tar.gz" ]; then
            # build-app.sh made no update: there was no key
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::warning title=No update signing key::TAURI_SIGNING_PRIVATE_KEY is not set, so this release has no update file and cannot be installed from inside the app (docs/RELEASING.md, Update signing key)"
            else
              echo "no update signing key: updater artifacts skipped"
            fi
            exit 0
          fi
          test -s "$bundle/StickyBot.app.tar.gz.sig" || { echo "::error::the update has no signature file"; exit 1; }
          # the ad-hoc signature must still be valid inside the tarball, with the hardened runtime
          check="$(mktemp -d)"
          tar -xzf "$bundle/StickyBot.app.tar.gz" -C "$check"
          ls "$check"
          app="$check/StickyBot.app"
          codesign --verify --deep --strict --verbose=1 "$app"
          info="$(codesign -dv "$app" 2>&1)"
          echo "$info"
          echo "$info" | grep -q '^Signature=adhoc' || { echo "::error::the app in the update is not signed ad hoc"; exit 1; }
          echo "$info" | grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\([^)]*runtime' || { echo "::error::the app in the update has no hardened runtime flag"; exit 1; }
          cp "$bundle/StickyBot.app.tar.gz" "../dist-app/$TARBALL"
          cp "$bundle/StickyBot.app.tar.gz.sig" "../dist-app/$TARBALL.sig"
          ls -l ../dist-app
          echo "present=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: |
            dist-app/${{ steps.names.outputs.zip }}
            dist-app/*.app.tar.gz
            dist-app/*.app.tar.gz.sig
          if-no-files-found: error
          compression-level: 0   # the zip and the update are compressed already
          retention-days: 14

  publish:
    needs: [tests, mac-app]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the release and upload its assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: mac-app
          path: dist

      - name: List the Mac app in manifest.json
        env:
          VERSION: ${{ needs.tests.outputs.version }}
          ZIP: ${{ needs.mac-app.outputs.zip }}
        run: |
          python3 tools/release_tool.py add-app dist/manifest.json "dist/$ZIP" macos-arm64 "$VERSION"
          cat dist/manifest.json
          (cd dist && sha256sum ./*)

      - name: latest.json for the in-app updater
        env:
          VERSION: ${{ needs.tests.outputs.version }}
          UPDATER: ${{ needs.mac-app.outputs.updater }}
          TARBALL: ${{ needs.mac-app.outputs.tarball }}
        run: |
          if [ "$UPDATER" != true ]; then
            echo "::warning title=No update file::this release has no signed update (no signing key), so it cannot be installed from inside the app"
            exit 0
          fi
          python3 tools/release_tool.py latest-json dist/latest.json --version "$VERSION" --tag "$GITHUB_REF_NAME" \
            --sig "dist/$TARBALL.sig" --asset "$TARBALL" --repo "$GITHUB_REPOSITORY"
          cat dist/latest.json

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tests.outputs.version }}
          PRERELEASE: ${{ needs.tests.outputs.prerelease }}
          ZIP: ${{ needs.mac-app.outputs.zip }}
          UPDATER: ${{ needs.mac-app.outputs.updater }}
          TARBALL: ${{ needs.mac-app.outputs.tarball }}
        run: |
          python3 tools/release_tool.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          set -- --title "StickyBot $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          if [ "$PRERELEASE" = true ]; then set -- "$@" --prerelease; fi
          set -- "$@" dist/manifest.json dist/bootloader.bin dist/partitions.bin dist/boot_app0.bin dist/app.bin "dist/$ZIP"
          # the signed update, its signature and latest.json, when the build made them
          if [ "$UPDATER" = true ]; then set -- "$@" "dist/$TARBALL" "dist/$TARBALL.sig" dist/latest.json; fi
          gh release create "$GITHUB_REF_NAME" "$@"
