; BLE macro keyboard — XIAO ESP32-C3
;
; Uses the pioarduino platform (Arduino core 3.x). The stock "espressif32"
; platform is still on core 2.x, which HijelHID_BLEKeyboard / NimBLE 2.x need.

[platformio]
; Local, untracked overrides (e.g. the OTA password) — see secrets.example.ini
extra_configs = secrets.ini

[env:xiao_c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
; Two 1.9 MB app slots (OTA needs two) — Bluetooth + Wi-Fi + web doesn't fit the default 1.25 MB.
board_build.partitions = min_spiffs.csv
extra_scripts = pre:tools/embed_page.py
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.8
    HijelHub/HijelHID_BLEKeyboard
build_flags =
    ; Serial over the C3's built-in USB-Serial/JTAG port
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
; Note: the core's Bluetooth stack stores at most 3 pairings (prebuilt
; CONFIG_BT_NIMBLE_MAX_BONDS=3) — exactly one per Mac slot.

; Over-the-air upload while the Wi-Fi settings page is on:
;   pio run -e xiao_c3_ota -t upload
; --auth must match the device password (default "macro-setup").
[env:xiao_c3_ota]
extends = env:xiao_c3
upload_protocol = espota
upload_port = xiao-key.local
upload_flags = --auth=macro-setup
