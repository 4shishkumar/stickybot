[project]
name = "stick-agent"
version = "2.3.2"
description = "StickyBot: a voice assistant for your Mac, driven by an M5StickS3"
requires-python = ">=3.11"
dependencies = ["bleak", "aiohttp", "rumps", "parakeet-mlx", "numpy", "soundfile", "soxr", "esptool", "pyserial", "sounddevice",
                "pyobjc-framework-WebKit",  # WebKit: the dashboard in its own window (window.py)
                "cryptography"]  # ed25519: the faces catalog's signature (faces.py); esptool needs it already

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-aiohttp>=1.0", "ruff>=0.5", "pre-commit>=3"]

[project.scripts]
stickybot = "stick_agent.__main__:main"
stick-agent = "stick_agent.__main__:main"  # the older name, kept working

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stick_agent"]

[tool.setuptools.package-data]
stick_agent = ["dashboard.html", "defaults/*", "static/*", "static/**/*", "firmware/*", "icon/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not slow and not coreaudio' -q"
markers = ["slow: needs the real speech model or hardware (run with -m slow)",
           "coreaudio: creates a real CoreAudio device (STICK_MIC_E2E=1 pytest -m coreaudio)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
  "E731",   # small lambdas are fine
  "SIM105", # try/except/pass reads clearer here than contextlib.suppress
  "SIM108", # ternaries aren't always clearer
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
