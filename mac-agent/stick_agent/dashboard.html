<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StickyBot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%2311161a'/%3E%3Crect x='21' y='12' width='22' height='40' rx='7' fill='%230b0d0f' stroke='%23465660' stroke-width='2'/%3E%3Crect x='26' y='24' width='4.5' height='9' rx='2.2' fill='%232ec4b6'/%3E%3Crect x='33.5' y='24' width='4.5' height='9' rx='2.2' fill='%232ec4b6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script>window.STICK_TOKEN = "{{TOKEN}}";</script>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Sections">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><div class="brand-eyes"><i></i><i></i></div></div>
      <div><div class="brand-name">StickyBot</div><div class="brand-sub" id="brandSub">your Mac, by voice</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <span class="pill" id="statePill" title="What the agent is doing"><span class="dot"></span><span id="stateText">Connecting…</span></span>
      <button class="btn" id="addStick" type="button">Add a stick</button>
    </div>
  </aside>
  <div class="main">
    <nav class="mobile-nav" id="mobileNav" aria-label="Sections"></nav>
    <header class="page-head">
      <div class="titles"><h1 id="pageTitle">Overview</h1><div class="sub" id="pageSub"></div></div>
      <div class="actions" id="pageActions"></div>
    </header>
    <div class="update-banner" id="updateBanner"></div>
    <main class="page" id="page"></main>
  </div>
</div>
<div id="wizardRoot"></div>
<noscript><p style="padding:24px">The dashboard needs JavaScript.</p></noscript>
<script type="module" src="/static/app.js"></script>
</body>
</html>
