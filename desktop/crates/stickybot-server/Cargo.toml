[package]
name = "stickybot-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "StickyBot's dashboard + local API (axum) on top of the stick link; the same page the Python agent serves"

[dependencies]
stick-link = { path = "../stick-link" }
macos-audio = { path = "../macos-audio" }
stt = { path = "../stt" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util", "process"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = { version = "8", features = ["mime-guess"] }
getrandom = "0.3"
base64 = "0.22"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
regex = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
ureq = "2"
bzip2 = "0.6"
tar = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "wav", "pcm", "flac", "mp3", "aiff"] }
serialport = { version = "4.10.1", default-features = false }

[dev-dependencies]
hound = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
cpal = "0.18"

[[bin]]
name = "stickybot-headless"
path = "src/bin/headless.rs"
