[package]
name = "stt"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Speech to text for the StickyBot desktop app (Phase-0 spike: sherpa-onnx Parakeet vs whisper.cpp)"

[features]
default = ["sherpa", "whisper"]
# sherpa-onnx, statically linked (prebuilt archive from k2-fsa's GitHub releases; CPU only on macOS)
sherpa = ["dep:sherpa-onnx", "sherpa-onnx/static"]
# the same engine linked against sherpa-onnx's shared libs (onnxruntime dylib, which has the CoreML EP)
sherpa-shared = ["dep:sherpa-onnx", "sherpa-onnx/shared"]
whisper = ["dep:whisper-rs"]
# FluidAudio (Swift package) through swift/FluidBridge; needs Xcode's swift toolchain, macOS 14+
fluid = []

[dependencies]
anyhow = "1"
hound = "3"        # bench only
serde_json = "1"   # bench only
sherpa-onnx = { version = "=2.0.1", optional = true, default-features = false }
whisper-rs = { version = "=0.16.0", optional = true, features = ["metal"] }

[[bin]]
name = "stt-bench"
path = "src/bin/stt-bench.rs"
