[package]
name = "stickybot-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "StickyBot (Rust): the menu bar app (Tauri 2) around the dashboard server and the stick link"

[[bin]]
name = "stickybot-rs"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
stickybot-server = { path = "../stickybot-server" }
stick-link = { path = "../stick-link" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }

[features]
# `cargo tauri dev` turns this on; it must exist
custom-protocol = ["tauri/custom-protocol"]
