[package]
name = "stickybot-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "StickyBot: the menu bar app (Tauri 2) around the dashboard server and the stick link"

[[bin]]
name = "stickybot-rs"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
stickybot-server = { path = "../stickybot-server" }
stick-link = { path = "../stick-link" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
log = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync"] }

# start at login (SMAppService, login.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# the Dock: NSApplicationDidBecomeActiveNotification's block (dock.rs)
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[features]
# `cargo tauri dev` turns this on; it must exist
custom-protocol = ["tauri/custom-protocol"]
