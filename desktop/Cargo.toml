[workspace]
resolver = "3"
members = ["crates/macos-audio", "crates/stt", "crates/stick-link", "crates/stickybot-server", "crates/stickybot-app"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[profile.release]
strip = "none"  # rust-objcopy SIGABRTs on this macOS (27.2) when stripping debuginfo; harmless, just noisy
